
name: networkops-monitoring

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?Database password required}
      ZBX_STARTPINGERS: "3"
    depends_on:
      postgres:
        condition: service_healthy
    cap_add:
      - NET_RAW
    networks:
      - backend
      - clab

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?Database password required}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Lisbon
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - zabbix-server
    networks:
      - backend

networks:
  backend:
  clab:
    external: true

volumes:
  postgres_data:

