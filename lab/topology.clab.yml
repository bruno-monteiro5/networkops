
name: networkops

topology:
  nodes:
    r1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r1/frr.conf
      enforce-startup-config: true
      daemons:
        - ospfd

    r2:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r2/frr.conf
      enforce-startup-config: true
      daemons:
        - ospfd

    
    host1:
      kind: linux
      image: alpine:3.22
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace 192.168.20.0/24 via 192.168.10.1 dev eth1

    host2:
      kind: linux
      image: alpine:3.22
      exec:
        - ip addr add 192.168.20.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace 192.168.10.0/24 via 192.168.20.1 dev eth1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "host1:eth1"]
    - endpoints: ["r2:eth2", "host2:eth1"]
